<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera Control</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <strong>Camera Control</strong>

    <div class="top-center">
      <select id="shots" aria-label="Shot"></select>
    </div>

    <div class="top-actions">
      <button id="homeView" type="button">Navigate</button>
      <button id="importGlb" type="button">Import</button>
      <button id="advancedToggle" type="button" aria-expanded="false">•••</button>
      <input id="importGlbInput" class="file-input" type="file" accept=".glb,model/gltf-binary">
    </div>
  </header>

  <section class="stage-card">
    <div class="stage" id="stage">
      <canvas id="scene"></canvas>
      <canvas id="frameOverlay"></canvas>

      <div class="motion-ui" id="motionUI">
        <div class="next-frame" id="nextFrame">
          <span>DRAG</span>
          <i class="rotate-handle" id="frameRotate" title="Rotate"></i>
          <i class="resize-handle" id="frameResize" title="Resize / zoom"></i>
        </div>

        <button class="ribbon-handle" id="ribbonHandle" type="button" title="Bend path"></button>

        <div class="ghost-frame ghost-1" id="ghost1"></div>
        <div class="ghost-frame ghost-2" id="ghost2"></div>
        <div class="ghost-frame ghost-3" id="ghost3"></div>

        <div class="motion-actions">
          <button id="motionReset" type="button" title="Reset">↺</button>
          <button id="motionApply" class="motion-apply" type="button">Apply</button>
        </div>
      </div>

      <div class="statusbar">
        <span id="status">DRAG ANYWHERE</span>
      </div>

      <div class="loading" id="loading">Building 3D room…</div>
      <div class="error" id="error"></div>
    </div>

    <div class="transport">
      <button id="origin" type="button" title="Back to shot start">⌂</button>
      <button class="play-main" id="play" type="button">▶ Play</button>
      <div class="time-wrap">
        <span id="readout">0.00</span>
        <input id="timeline" type="range" min="0" max="1" step=".01" value="0">
        <span id="totalReadout">0.00</span>
      </div>
      <button id="stabilizePath" class="stabilize-btn" type="button" title="轻微平滑当前轨迹，减少抖动和速度卡顿">一键防抖防止卡顿</button>
    </div>

    <div class="mini-views">
      <div class="mini-view">
        <canvas id="topView"></canvas>
        <div class="mini-caption"><b>TOP</b></div>
      </div>
      <div class="mini-view">
        <canvas id="sideView"></canvas>
        <div class="mini-caption"><b>SIDE</b><span id="heightHint">auto</span></div>
      </div>
    </div>
  </section>

  <aside class="inspector" id="advancedDrawer" aria-hidden="true">
    <div class="drawer-head">
      <b>Advanced</b>
      <button id="advancedClose" type="button">×</button>
    </div>

    <label class="field">
      <span>Look at</span>
      <select id="targets"></select>
    </label>
    <div class="target-meta" id="targetMeta"></div>

    <details class="axes-detail">
      <summary>Six-axis</summary>
      <div class="axes-body">
        <div class="control-pair">
          <label class="quick-control"><span>Horizontal <b id="qHorizontalVal">0.0</b></span><input id="qHorizontal" type="range" min="-10" max="10" step=".1" value="0"></label>
          <label class="quick-control"><span>Pan <b id="qPanVal">0.0</b></span><input id="qPan" type="range" min="-10" max="10" step=".1" value="0"></label>
        </div>
        <div class="control-pair">
          <label class="quick-control"><span>Vertical <b id="qVerticalVal">0.0</b></span><input id="qVertical" type="range" min="-10" max="10" step=".1" value="0"></label>
          <label class="quick-control"><span>Tilt <b id="qTiltVal">0.0</b></span><input id="qTilt" type="range" min="-10" max="10" step=".1" value="0"></label>
        </div>
        <div class="control-pair">
          <label class="quick-control"><span>Zoom <b id="qZoomVal">0.0</b></span><input id="qZoom" type="range" min="-10" max="10" step=".1" value="0"></label>
          <label class="quick-control"><span>Rotate <b id="qRotateVal">0.0</b></span><input id="qRotate" type="range" min="-10" max="10" step=".1" value="0"></label>
        </div>
        <div class="axes-actions">
          <button id="qReset" type="button">Reset</button>
          <button id="qApply" type="button">Apply</button>
        </div>
      </div>
    </details>

    <label class="field">
      <span>Move</span>
      <select id="segments"></select>
    </label>

    <div class="speed-control">
      <div class="control-head">
        <label id="speedLabel" for="speed">Speed</label>
        <span id="speedVal">1.00×</span>
      </div>
      <input id="speed" type="range" min=".25" max="3" step=".05" value="1">
    </div>

    <div class="points" id="points"></div>

    <div class="point-actions">
      <button class="continue-btn" id="addPoint" type="button">＋ Next</button>
      <button class="delete-btn" id="deletePoint" type="button">Delete</button>
    </div>

    <details class="timing-detail">
      <summary>Timing</summary>
      <div class="control">
        <div class="control-head"><label for="duration">Duration</label><span id="durationVal">2.0 s</span></div>
        <input id="duration" type="range" min=".5" max="8" step=".1" value="2">
      </div>
      <div class="control">
        <div class="control-head"><label for="accelIn">Accel</label><span id="accelInVal">5.0</span></div>
        <input id="accelIn" type="range" min="0" max="10" step=".1" value="5">
      </div>
      <div class="control">
        <div class="control-head"><label for="brakeOut">Brake</label><span id="brakeOutVal">5.0</span></div>
        <input id="brakeOut" type="range" min="0" max="10" step=".1" value="5">
      </div>
      <div id="segmentSummary" class="segment-summary"></div>
    </details>

    <div class="advanced-actions">
      <button id="playSequence" type="button">Play all</button>
      <button id="loop" type="button">Loop</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </aside>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
