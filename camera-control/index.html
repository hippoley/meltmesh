<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera Control</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <strong>Camera Control</strong>
    <div class="top-actions">
      <button id="homeView" type="button">Free</button>
      <button id="importGlb" type="button">Import</button>
      <input id="importGlbInput" class="file-input" type="file" accept=".glb,model/gltf-binary">
    </div>
  </header>

  <div class="workspace">
    <section class="stage-card">
      <div class="stage" id="stage">
        <canvas id="scene"></canvas>
        <canvas id="frameOverlay"></canvas>

        <div class="statusbar">
          <span id="status">READY</span>
          <span>drag · zoom · click object</span>
        </div>

        <div class="loading" id="loading">Building 3D room…</div>
        <div class="error" id="error"></div>
      </div>

      <div class="transport">
        <button id="origin" type="button" title="Back to shot start">⌂</button>
        <button class="play-main" id="play" type="button">▶ Play</button>
        <div class="time-wrap">
          <span id="readout">0.00</span>
          <input id="timeline" type="range" min="0" max="1" step=".01" value="0">
          <span id="totalReadout">0.00</span>
        </div>
      </div>

      <div class="mini-views">
        <div class="mini-view">
          <canvas id="topView"></canvas>
          <span>TOP · room projection · click = next point</span>
        </div>
        <div class="mini-view">
          <canvas id="sideView"></canvas>
          <span>SIDE · room projection · drag = height</span>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <label class="field">
        <span>Shot</span>
        <select id="shots"></select>
      </label>

      <label class="field">
        <span>Look at</span>
        <select id="targets"></select>
      </label>
      <div class="target-meta" id="targetMeta"></div>

      <div class="quick-move">
        <div class="quick-title">Camera move</div>

        <label class="quick-control">
          <span>Horizontal <b id="qHorizontalVal">0.0</b></span>
          <input id="qHorizontal" type="range" min="-10" max="10" step=".1" value="0">
        </label>
        <label class="quick-control">
          <span>Pan <b id="qPanVal">0.0</b></span>
          <input id="qPan" type="range" min="-10" max="10" step=".1" value="0">
        </label>
        <label class="quick-control">
          <span>Vertical <b id="qVerticalVal">0.0</b></span>
          <input id="qVertical" type="range" min="-10" max="10" step=".1" value="0">
        </label>
        <label class="quick-control">
          <span>Tilt <b id="qTiltVal">0.0</b></span>
          <input id="qTilt" type="range" min="-10" max="10" step=".1" value="0">
        </label>
        <label class="quick-control">
          <span>Zoom <b id="qZoomVal">0.0</b></span>
          <input id="qZoom" type="range" min="-10" max="10" step=".1" value="0">
        </label>
        <label class="quick-control">
          <span>Rotate <b id="qRotateVal">0.0</b></span>
          <input id="qRotate" type="range" min="-10" max="10" step=".1" value="0">
        </label>

        <button class="apply-move" id="qApply" type="button">Apply movement</button>
      </div>

      <details class="advanced">
        <summary>Path / timing</summary>
        <div class="advanced-body">
          <label class="field">
            <span>Move</span>
            <select id="segments"></select>
          </label>

          <div class="speed-control">
            <div class="control-head">
              <label id="speedLabel" for="speed">Speed</label>
              <span id="speedVal">1.00×</span>
            </div>
            <input id="speed" type="range" min=".25" max="3" step=".05" value="1">
          </div>

          <button class="continue-btn" id="addPoint" type="button">＋ Next point</button>

          <div class="points" id="points"></div>
          <button class="delete-btn" id="deletePoint" type="button">Delete point</button>

          <div class="control">
            <div class="control-head"><label for="duration">Duration</label><span id="durationVal">2.0 s</span></div>
            <input id="duration" type="range" min=".5" max="8" step=".1" value="2">
          </div>

          <div class="control">
            <div class="control-head"><label for="accelIn">Accel</label><span id="accelInVal">5.0</span></div>
            <input id="accelIn" type="range" min="0" max="10" step=".1" value="5">
          </div>

          <div class="control">
            <div class="control-head"><label for="brakeOut">Brake</label><span id="brakeOutVal">5.0</span></div>
            <input id="brakeOut" type="range" min="0" max="10" step=".1" value="5">
          </div>

          <div id="segmentSummary" class="segment-summary"></div>

          <div class="advanced-actions">
            <button id="playSequence" type="button">Play all</button>
            <button id="loop" type="button">Loop</button>
            <button id="reset" type="button">Reset</button>
          </div>
        </div>
      </details>
    </aside>
  </div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
