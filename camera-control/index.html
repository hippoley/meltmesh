<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera Control</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <strong>Camera Control</strong>
    <div class="top-actions">
      <button id="homeView" type="button">Free view</button>
      <button id="importGlb" type="button">Import GLB</button>
      <input id="importGlbInput" class="file-input" type="file" accept=".glb,model/gltf-binary">
    </div>
  </header>

  <div class="workspace">
    <section class="stage-card">
      <div class="stage" id="stage">
        <canvas id="scene"></canvas>

        <div class="statusbar">
          <span id="status">READY</span>
          <span>drag · zoom · click object to focus</span>
        </div>

        <div class="transport">
          <button id="origin" type="button">⌂</button>
          <button class="play-main" id="play" type="button">▶ Play</button>
          <div class="time-wrap">
            <span id="readout">0.00 s</span>
            <input id="timeline" type="range" min="0" max="1" step=".01" value="0">
            <span id="totalReadout">0.00 s</span>
          </div>
        </div>

        <div class="mini-views">
          <div class="mini-view">
            <canvas id="topView"></canvas>
            <span>TOP</span>
          </div>
          <div class="mini-view">
            <canvas id="sideView"></canvas>
            <span>SIDE</span>
          </div>
        </div>

        <div class="loading" id="loading">Building 3D room…</div>
        <div class="error" id="error"></div>
      </div>
    </section>

    <aside class="inspector">
      <section class="block">
        <div class="block-head"><b>Shot</b></div>
        <div class="shots" id="shots"></div>
      </section>

      <section class="block">
        <div class="block-head"><b>Focus</b><small>or click object in scene</small></div>
        <div class="targets" id="targets"></div>
        <div class="target-meta" id="targetMeta"></div>
      </section>

      <section class="block">
        <div class="block-head"><b>Segment</b><small>pick one, then change speed</small></div>
        <div class="segments" id="segments"></div>

        <div class="speed-control">
          <div class="control-head">
            <label for="speed">Speed</label>
            <span id="speedVal">1.00×</span>
          </div>
          <input id="speed" type="range" min=".25" max="3" step=".05" value="1">
        </div>

        <div class="motion-presets">
          <button type="button" data-motion-preset="smooth">Smooth</button>
          <button type="button" data-motion-preset="cruise">Cruise</button>
          <button type="button" data-motion-preset="arrive">Arrive</button>
        </div>

        <div id="segmentSummary" class="segment-summary"></div>
      </section>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-body">
          <div class="points" id="points"></div>
          <div class="row-actions">
            <button id="addPoint" type="button">+ Point</button>
            <button id="deletePoint" type="button">Delete</button>
          </div>

          <div class="grid2">
            <div class="control">
              <div class="control-head"><label for="duration">Duration</label><span id="durationVal">2.0 s</span></div>
              <input id="duration" type="range" min=".5" max="8" step=".1" value="2">
            </div>
            <div class="control">
              <div class="control-head"><label for="accelIn">Accel</label><span id="accelInVal">5.0</span></div>
              <input id="accelIn" type="range" min="0" max="10" step=".1" value="5">
            </div>
            <div class="control">
              <div class="control-head"><label for="brakeOut">Brake</label><span id="brakeOutVal">5.0</span></div>
              <input id="brakeOut" type="range" min="0" max="10" step=".1" value="5">
            </div>
          </div>

          <div class="advanced-actions">
            <button id="playSequence" type="button">Play all shots</button>
            <button id="loop" type="button">Loop</button>
            <button id="reset" type="button">Reset</button>
          </div>
        </div>
      </details>
    </aside>
  </div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
